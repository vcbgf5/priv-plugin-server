name: PrivServer
main: com.dziubek.privserver.PrivServerPlugin
version: 1.0.0
api-version: '1.21'
author: Dziubek
description: >
  Plugin dla serwera prywatnego - wlasna biala lista (niezalezna od whitelist.json Vanilli,
  wlacz/wylacz komenda /bialalista) z wlasnym komunikatem po odrzuceniu, oraz MOTD tego
  serwera ustawione na "Serwer prywatny - skontaktuj sie z administratorem".
commands:
  bialalista:
    description: Zarzadzanie wlasna biala lista tego serwera prywatnego.
    usage: /bialalista <dodaj|usun|lista|wlacz|wylacz> [gracz]
    aliases: [whitelist, wl]
    permission: privserver.bialalista
    permission-message: "§cNie masz uprawnien do tej komendy."
permissions:
  privserver.bialalista:
    description: Zarzadzanie biala lista serwera prywatnego.
    default: op
