name: PrivServer
main: com.dziubek.privserver.PrivServerPlugin
version: 1.0.0
api-version: '1.21'
author: Dziubek
description: >
  Plugin dla serwera prywatnego - wlasna biala lista (niezalezna od whitelist.json Vanilli,
  wlacz/wylacz komenda /bialalista) z wlasnym komunikatem po odrzuceniu, MOTD tego serwera
  ustawione na "Serwer prywatny - skontaktuj sie z administratorem", komenda /zamknij (tymczasowe
  zamkniecie serwera + zmiana MOTD) oraz laczenie wagonikow w pociag (shift+PPM na dwoch z rzedu).
commands:
  bialalista:
    description: Zarzadzanie wlasna biala lista tego serwera prywatnego.
    usage: /bialalista <dodaj|usun|lista|wlacz|wylacz> [gracz]
    aliases: [whitelist, wl]
    permission: privserver.bialalista
    permission-message: "§cNie masz uprawnien do tej komendy."
  zamknij:
    description: Przelacza tymczasowe zamkniecie serwera (tylko operatorzy, zmienia MOTD).
    usage: /zamknij
    permission: privserver.zamknij
    permission-message: "§cNie masz uprawnien do tej komendy."
  setpower:
    description: Ustawia sztywna predkosc (bloki/s) na szynie, na ktora patrzysz. 0 = wylacz.
    usage: /setpower <bloki/sekunde>
    permission: privserver.setpower
    permission-message: "§cNie masz uprawnien do tej komendy."
permissions:
  privserver.bialalista:
    description: Zarzadzanie biala lista serwera prywatnego.
    default: op
  privserver.zamknij:
    description: Tymczasowe zamykanie/otwieranie serwera prywatnego.
    default: op
  privserver.setpower:
    description: Ustawianie wymuszonej predkosci na szynach.
    default: op
